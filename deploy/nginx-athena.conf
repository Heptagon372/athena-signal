# 아테나 시그널 — nginx 리버스 프록시
# ------------------------------------
# 사용법 (DEPLOY.md 6단계):
#   1) athena.example.com 을 전부 실제 도메인으로 바꿉니다
#   2) sudo cp deploy/nginx-athena.conf /etc/nginx/sites-available/athena
#      sudo ln -s /etc/nginx/sites-available/athena /etc/nginx/sites-enabled/
#   3) sudo certbot --nginx -d 도메인   ← ssl_certificate 두 줄을 채워 줍니다
#
# 구조: 외부에는 80/443 만 열립니다. uvicorn(8000)과 Next(3000)는 127.0.0.1
# 에만 묶여 있어 이 프록시를 거치지 않고는 닿을 수 없습니다 — "외부에서
# 건드리지 못하게" 의 첫 번째 층입니다.

server {
    listen 80;
    listen [::]:80;
    server_name athena.example.com;

    # certbot(Let's Encrypt) 인증 파일
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # 나머지는 전부 https 로
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name athena.example.com;

    # certbot 이 발급 후 채우는 자리 (수동으로 만들 필요 없음)
    ssl_certificate     /etc/letsencrypt/live/athena.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/athena.example.com/privkey.pem;

    server_tokens off;
    client_max_body_size 2m;

    # 백엔드가 신뢰하는 헤더 — systemd 유닛의 ATHENA_BEHIND_PROXY=1 과 짝입니다.
    # $proxy_add_x_forwarded_for 가 아니라 $remote_addr 인 것이 핵심입니다:
    # 클라이언트가 X-Forwarded-For 를 위조해 보내도 여기서 실제 접속 IP 로
    # **덮어씁니다**. 레이트 리밋(security.py)이 이 값을 믿습니다.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # API 는 FastAPI(8000)로 직접 보냅니다. Next 의 /api 프록시를 거치면
    # 구글 OAuth 콜백의 302 와 쿠키가 사라집니다 (ACCOUNTS.md 3-2).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 120s;
    }

    # 자동매매 콘솔·구버전 정적 파일도 백엔드가 직접 그립니다
    location /autotrade { proxy_pass http://127.0.0.1:8000; }
    location /static/   { proxy_pass http://127.0.0.1:8000; }
    location /legacy    { proxy_pass http://127.0.0.1:8000; }

    # 나머지 화면은 Next.js(3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        # Next 개발 모드의 HMR 웹소켓용 (프로덕션 빌드에서는 쓰이지 않지만 무해)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
