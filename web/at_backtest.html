<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아테나 시그널 백테스트</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/static/at_common.css">
</head>
<body>
<main>
  <section>
    <h2>백테스트 <span class="sub">라이브와 같은 신호, 청산 규칙으로 과거를 돌립니다</span></h2>
    <div class="row">
      <input id="btQuery" placeholder="종목 (예: 005930, FUT_FRONT)" style="flex:1;min-width:150px">
      <input id="btDays" type="number" value="250" style="width:110px" title="일봉 개수">
      <button id="btnBacktest" class="primary">실행</button>
      <label class="chk" style="margin:0" title="예측 가능한 순서를 없앤 가짜 가격에 같은 전략을 통과시켜 봅니다">
        <input type="checkbox" id="btFalsify"> 위조검증 (20회   수십 초)</label>
    </div>
    <div id="btResult" style="margin-top:12px"></div>
    <div class="note" style="margin-top:8px">
      <b>총수익률부터 보지 마세요.</b> 상승장에서는 아무 전략이나 총수익률이 올라갑니다.
      매매가 실제로 무엇을 보탰는지는 <b>초과수익</b>(그냥 사서 들고 있기 대비)에만 나옵니다.
      <br>일봉 종가 기준이라 장중 손절 도달은 다음 날 종가로 처리됩니다. 분봉, 뉴스는 과거
      데이터를 구할 수 없어 반영하지 않습니다. <b>수익 예측이 아니라 설정 점검용</b>입니다.
    </div>
  </section>

  <div class="grid side">
    <section>
      <h2>주문 원장 <span class="sub" id="orderSub"></span></h2>
      <div class="scroll-x" style="max-height:420px"><table id="ordTable">
        <thead><tr><th>시각</th><th>종목</th><th>동작</th><th class="num">수량</th>
          <th class="num">가격</th><th class="num">실현손익</th><th>상태</th></tr></thead>
        <tbody></tbody></table></div>
    </section>

    <section>
      <h2>일자별 기록 <span class="sub">계좌 기준값   손실 한도 판정에 쓰이는 값</span></h2>
      <div class="scroll-x" style="max-height:420px"><table id="dailyTable">
        <thead><tr><th>날짜</th><th class="num">시작</th><th class="num">최고</th>
          <th class="num">종료</th><th class="num">실현손익</th><th class="num">매매</th></tr></thead>
        <tbody></tbody></table></div>
    </section>
  </div>
</main>

<script>
window.PAGE = {
  nav: "backtest",
  title: "백테스트   기타",
  desc: "설정 검증과 기록 조회, 여기서는 주문이 나가지 않습니다.",
  ACTION: {buy:"매수", sell:"매도", close:"청산", open_long:"롱진입", open_short:"숏진입"},
  STATUS: {filled:"체결", partial:"부분체결", pending:"대기", rejected:"거부",
           cancelled:"취소됨", cancel_requested:"취소요청", lost:"결말미상"},

  init() {
    AT.$("btnBacktest").onclick = () => this.run();
    this.loadOrders();
    setInterval(() => this.loadOrders(), 20000);
  },
  onSnapshot(snap) {
    // 첫 스냅샷이 오면 기본 종목을 채워줍니다 (병렬 부팅이라 init 시점엔 아직 없음)
    const q = AT.$("btQuery");
    if (q && !q.value) q.value = (snap.config?.universe || [])[0] || "";
  },

  async run() {
    const A = AT;
    const q = A.$("btQuery").value.trim() || (A.SNAP?.config?.universe || [])[0];
    if (!q) return A.toast("종목을 입력하세요.", true);
    const falsify = A.$("btFalsify").checked ? 20 : 0;
    A.$("btnBacktest").disabled = true;
    A.$("btResult").innerHTML = `<div class="note">계산 중…${falsify
      ? " 위조검증까지 하느라 수십 초 걸립니다." : ""}</div>`;
    try {
      const r = await A.call("/autotrade/backtest", {method: "POST",
        body: {query: q, days: Number(A.$("btDays").value) || 250, falsify}});
      A.$("btResult").innerHTML = `
        ${this.verdict(r)}
        ${this.rejectBox(r.rejections)}
        <div class="stat">
          ${[["초과수익 (핵심)", A.pct(r.excess_return_pct), A.sign(r.excess_return_pct)],
             ["총수익률", A.pct(r.total_return_pct), A.sign(r.total_return_pct)],
             ["그냥 보유했다면", A.pct(r.benchmark_return_pct), A.sign(r.benchmark_return_pct)],
             ["액티브 샤프", (r.active_sharpe ?? 0).toFixed(2), A.sign(r.active_sharpe)],
             ["샤프", (r.sharpe ?? 0).toFixed(2), ""],
             ["최대낙폭", A.pct(r.max_drawdown_pct), "down"],
             ["매매 횟수", r.trade_count + "회", ""],
             ["승률", r.win_rate.toFixed(0) + "%", ""],
             ["손익비", r.profit_factor || "-", ""],
             ["최종 평가금", A.won(r.final_equity), ""]]
            .map(([k, v, c]) => `<div class="box"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`).join("")}
        </div>
        ${this.gatesBox(r.gates)}
        ${this.falsifyBox(r.falsification)}
        <div class="scroll-x" style="max-height:240px;margin-top:10px"><table>
          <thead><tr><th>진입</th><th>청산</th><th>방향</th><th class="num">손익</th><th>사유</th></tr></thead>
          <tbody>${(r.trades || []).slice().reverse().map((t) => `<tr>
            <td class="mono">${t.entry_at}</td><td class="mono">${t.exit_at}</td>
            <td>${t.side === "long" ? "롱" : "숏"}</td>
            <td class="num ${A.sign(t.pnl)}">${A.won(t.pnl)}</td>
            <td class="muted">${A.esc(t.reason)}</td></tr>`).join("")
            || '<tr><td colspan="5" class="center">체결된 매매가 없습니다 (임계값을 낮춰보세요).</td></tr>'}
          </tbody></table></div>
        ${this.executionNote(r.execution)}`;
    } catch (e) { A.$("btResult").innerHTML = `<div class="note up">${A.esc(e.message)}</div>`; }
    finally { A.$("btnBacktest").disabled = false; }
  },

  // 숫자를 나열하기 전에 한 줄로 답합니다 — "그래서 이 설정을 켜도 되는가"
  verdict(r) {
    if (r.excess_return_pct == null) return "";
    const beat = r.excess_return_pct > 0;
    return `<div class="warnbox" style="margin-bottom:10px;${beat
        ? "border-color:var(--olive);color:#b6c496" : "border-color:var(--up);color:#f0917f"}">
      ${beat
        ? `<b>그냥 보유하는 것보다 ${AT.pct(r.excess_return_pct)} 나았습니다.</b>
           매매가 실제로 무언가를 보탰습니다.`
        : `<b>그냥 사서 들고 있는 편이 ${Math.abs(r.excess_return_pct).toFixed(2)}%p 나았습니다.</b>
           이 설정은 수수료를 내며 시장을 따라갔습니다. 총수익률이 양수여도 마찬가지입니다.`}
    </div>`;
  },

  // 체결되지 못하고 사라진 신호 — 성과 숫자보다 먼저 봐야 합니다.
  //
  // 거부를 안 보여주면 "매매를 적게 하는 신중한 설정" 처럼 보입니다. 실제로는
  // 낼 수 없었던 주문이 조용히 빠진 것이고, 남은 매매만으로 만든 성과입니다.
  rejectBox(rej) {
    if (!rej || !rej.total) return "";
    const rows = Object.entries(rej.by_reason || {})
      .map(([, v]) => `${AT.esc(v.label)} ${v.count}건`).join("   ");
    return `<div class="warnbox" style="margin-bottom:10px;border-color:var(--up);color:#f0917f">
      <b>신호 ${rej.total}건이 체결되지 못했습니다.</b>
      아래 성과는 이 주문들을 뺀 나머지로 만든 것입니다.
      <div class="note" style="margin-top:4px">${rows}</div>
    </div>`;
  },

  // 어떤 체결 가정에서 나온 숫자인가 — 모형이 바뀌면 성과도 바뀝니다.
  executionNote(ex) {
    if (!ex) return "";
    return `<div class="note" style="margin-top:8px">
      체결 모형, ${AT.esc(ex.note || "")}
      갭으로 손절선을 관통하면 손절값이 아니라 시가에 체결하고, 구간 끝에 남은
      포지션도 정산해 매매 통계에 포함합니다. 슬리피지 ${ex.slippage_bps}bp.
    </div>`;
  },

  // 과최적화 검증 하네스 — 계산은 진작 되고 있었는데 화면에 안 나왔습니다.
  //
  // 총수익률·샤프만 보고 판단하지 않게 만드는 것이 목적입니다. 판정을 먼저
  // 쓰고 근거 숫자를 뒤에 놓습니다 (숫자를 먼저 보면 판정을 안 읽습니다).
  gatesBox(g) {
    if (!g) return "";
    if (!g.ok) return `<div class="note" style="margin-top:10px">${AT.esc(g.reason || "")}</div>`;
    const pass = String(g.verdict || "").startsWith("게이트 통과");
    const num = (v, d = 2) => (v == null ? "-" : Number(v).toFixed(d));
    const c = g.cpcv || {}, o = g.overfit || {}, l = g.lottery || {}, dsr = g.dsr || {};
    const rows = [
      ["CPCV 최악 경로 샤프", c.sharpe_worst == null ? "-"
        : `${num(c.sharpe_worst)} (양수 경로 ${c.share_positive == null ? "-"
          : (c.share_positive * 100).toFixed(0) + "%"})`],
      ["무작위 매매 대비", l.percentile == null ? "-"
        : `${num(l.percentile, 1)} 백분위`],
      ["요구 t통계", o.required_tstat == null ? "-"
        : `${num(o.t_stat)} / ${num(o.required_tstat)} 필요`],
      ["시행 수 (DSR 보정)", g.registry?.effective_n == null ? "-"
        : `${g.registry.effective_n}회${dsr.dsr == null ? "" : `   DSR ${num(dsr.dsr)}`}`],
      ["데이터 길이", o.have_years == null ? "-"
        : `${num(o.have_years)}년 / 최소 ${num(o.min_backtest_years)}년`],
    ];
    return `<div class="warnbox" style="margin-top:10px;${pass
        ? "border-color:var(--olive);color:#b6c496" : "border-color:var(--up);color:#f0917f"}">
      <b>${pass ? "과최적화 게이트 통과" : "과최적화 게이트 경고"}</b>
      <div style="margin-top:4px">${AT.esc(g.verdict || "")}</div>
      <div class="note" style="margin-top:6px">
        ${rows.map(([k, v]) => `${AT.esc(k)} <b>${AT.esc(String(v))}</b>`).join("   ")}
      </div>
    </div>`;
  },

  falsifyBox(f) {
    if (!f) return "";
    if (f.passed == null) return `<div class="note" style="margin-top:10px">${AT.esc(f.reason || "")}</div>`;
    const ok = f.passed;
    return `<div class="warnbox" style="margin-top:10px;${ok
        ? "border-color:var(--olive);color:#b6c496" : "border-color:var(--up);color:#f0917f"}">
      <b>위조검증 ${ok ? "통과" : "실패"}</b>, ${AT.esc(f.verdict)}
      <div class="note" style="margin-top:4px">
        예측 가능한 순서를 없앤 가짜 가격 ${f.n_trials}회에서 총수익률 평균
        ${AT.pct(f.null_mean)} (범위 ${AT.pct(f.null_min)} ~ ${AT.pct(f.null_max)}).
        실제 성과 ${AT.pct(f.observed)}   p=${f.p_value}
        ${ok ? "" : ", 즉 이 성과는 가짜 데이터에서도 비슷하게 나옵니다."}
      </div>
    </div>`;
  },

  async loadOrders() {
    const A = AT;
    try {
      const d = await A.call("/autotrade/orders?limit=40");
      const eq = d.execution_quality || {};
      A.$("orderSub").textContent = `총 ${d.summary.orders}건   거부 ${d.summary.rejected}건`
        + (eq.samples ? `   평균 슬리피지 ${eq.avg_slippage_bps}bp (${eq.samples}건)` : "");
      A.$("ordTable").querySelector("tbody").innerHTML = (d.orders || []).map((o) => `<tr>
        <td class="muted mono">${o.created_at.slice(5, 16).replace("T", " ")}</td>
        <td>${A.esc(o.name || o.symbol)}</td>
        <td>${this.ACTION[o.action] || o.action}</td>
        <td class="num">${A.num(o.quantity, 4)}</td>
        <td class="num">${A.num(o.price)}</td>
        <td class="num ${A.sign(o.realized_pnl)}">${o.realized_pnl == null ? "-" : A.won(o.realized_pnl)}</td>
        <td class="${o.status === "rejected" ? "up" : "muted"}" title="${A.esc(o.reason || "")}">
          ${this.STATUS[o.status] || o.status}${o.slippage_bps != null
            ? ` <span class="muted">${o.slippage_bps > 0 ? "+" : ""}${o.slippage_bps}bp</span>` : ""}</td>
      </tr>`).join("") || '<tr><td colspan="7" class="center">주문 기록이 없습니다.</td></tr>';

      A.$("dailyTable").querySelector("tbody").innerHTML = (d.daily || []).map((r) => {
        const pnl = r.end_value - r.start_value;
        return `<tr>
          <td class="mono">${r.trade_date}</td>
          <td class="num">${A.won(r.start_value)}</td>
          <td class="num">${A.won(r.peak_value)}</td>
          <td class="num">${A.won(r.end_value)}</td>
          <td class="num ${A.sign(pnl)}">${A.won(pnl)}</td>
          <td class="num">${r.trade_count}</td>
        </tr>`;
      }).join("") || '<tr><td colspan="6" class="center">기록이 없습니다.</td></tr>';
    } catch {}
  },
};
</script>
<script src="/static/at_common.js"></script>
</body>
</html>
